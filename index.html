<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATE Operations Management Suite</title>
  <meta name="description" content="Professional structured web application for operations management, task tracking, and DevOps control." />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <!-- App Stylesheets -->
  <link rel="stylesheet" href="./assets/css/variables.css" />
  <link rel="stylesheet" href="./assets/css/base.css" />
  <link rel="stylesheet" href="./assets/css/components.css" />
  <link rel="stylesheet" href="./assets/css/layout.css" />
  <link rel="stylesheet" href="./assets/css/animations.css" />
</head>
<body>
  <div id="app-container">
    <!-- Sidebar Component -->
    <aside class="sidebar" id="sidebar-container"></aside>

    <!-- Main Content Wrapper -->
    <div class="main-wrapper">
      <!-- Top Header Bar -->
      <header class="top-header" id="header-container"></header>

      <!-- Main Body Container -->
      <main class="content-body">
        <!-- Stats Overview Row -->
        <section id="stats-container"></section>

        <!-- Dynamic Filter Controls Bar -->
        <section id="filter-bar-container"></section>

        <!-- Main View Container (Grid / Table / Kanban / Analytics / Archive) -->
        <section id="main-view-container"></section>
      </main>
    </div>
  </div>

  <!-- Modal Containers -->
  <div id="task-modal-container"></div>
  <div id="confirm-modal-container"></div>
  
  <!-- Toast Container -->
  <div id="toast-container"></div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
