stages:
  - lint_and_test
  - compile
  - docker_build
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG

# ----------------------------------------------------
# Stage 1: Go Tests
# ----------------------------------------------------
unit_tests:
  stage: lint_and_test
  image: golang:1.22-alpine
  script:
    - go test -v ./...

# ----------------------------------------------------
# Stage 2: Go Compile Verification
# ----------------------------------------------------
compile_binary:
  stage: compile
  image: golang:1.22-alpine
  script:
    - go build -o ate-app main.go
  artifacts:
    paths:
      - ate-app
    expire_in: 1 day

# ----------------------------------------------------
# Stage 3: Docker Image Build
# ----------------------------------------------------
docker_build:
  stage: docker_build
  image: docker:24.0.5-dind
  services:
    - docker:24.0.5-dind
  script:
    - docker build -t $IMAGE_TAG .
    - echo "Successfully built Go container image: $IMAGE_TAG"
  only:
    - main
    - dev

# ----------------------------------------------------
# Stage 4: Deployment
# ----------------------------------------------------
deploy_staging:
  stage: deploy
  script:
    - echo "Deploying Go Operations Suite to Staging..."
  environment:
    name: staging
  only:
    - dev
