# ==============================================================================
# Central Platform Infrastructure CI/CD Pipeline
# Repository: manveersyan-group/ate
# Path: .gitlab-ci.yml
# ==============================================================================

stages:
  - validate
  - plan
  - apply
  - verify

variables:
  TF_VERSION: "1.5.7"
  TF_ROOT: "terraform/environments"
  AWS_DEFAULT_REGION: "us-east-1"
  DOCKER_HOST: tcp://docker:2375

cache:
  key: "${CI_COMMIT_REF_SLUG}-terraform"
  paths:
    - terraform/environments/dev/.terraform/
    - terraform/environments/staging/.terraform/
    - terraform/environments/production/.terraform/

.terraform-base:
  image:
    name: hashicorp/terraform:${TF_VERSION}
    entrypoint: [""]
  before_script:
    - terraform --version
    - export AWS_ACCESS_KEY_ID="${AWS_ACCESS_KEY_ID}"
    - export AWS_SECRET_ACCESS_KEY="${AWS_SECRET_ACCESS_KEY}"

# ----------------------------------------------------
# Stage 1: Validation & Linting
# ----------------------------------------------------
fmt_and_validate:
  extends: .terraform-base
  stage: validate
  script:
    - cd terraform
    - terraform fmt -check -recursive
    - cd environments/dev && terraform init -backend=false && terraform validate
    - cd ../staging && terraform init -backend=false && terraform validate
    - cd ../production && terraform init -backend=false && terraform validate
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

tflint_job:
  stage: validate
  image:
    name: ghcr.io/terraform-linters/tflint:v0.50.0
    entrypoint: [""]
  script:
    - tflint --init --config=.tflint.hcl
    - tflint --recursive
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

checkov_job:
  stage: validate
  image:
    name: bridgecrew/checkov:3.2.0
    entrypoint: [""]
  script:
    - checkov --config-file .checkov.yaml
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ----------------------------------------------------
# Stage 2: Terraform Plan (Parallel Jobs for Environments)
# ----------------------------------------------------
plan_dev:
  extends: .terraform-base
  stage: plan
  environment:
    name: dev
    action: prepare
  script:
    - cd terraform/environments/dev
    - terraform init
    - terraform plan -out=plan-dev.tfplan
  artifacts:
    name: dev-tfplan
    paths:
      - terraform/environments/dev/plan-dev.tfplan
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

plan_staging:
  extends: .terraform-base
  stage: plan
  environment:
    name: staging
    action: prepare
  script:
    - cd terraform/environments/staging
    - terraform init
    - terraform plan -out=plan-staging.tfplan
  artifacts:
    name: staging-tfplan
    paths:
      - terraform/environments/staging/plan-staging.tfplan
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

plan_production:
  extends: .terraform-base
  stage: plan
  environment:
    name: production
    action: prepare
  script:
    - cd terraform/environments/production
    - terraform init
    - terraform plan -out=plan-prod.tfplan
  artifacts:
    name: prod-tfplan
    paths:
      - terraform/environments/production/plan-prod.tfplan
    expire_in: 7 days
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ----------------------------------------------------
# Stage 3: Terraform Apply
# ----------------------------------------------------
apply_dev:
  extends: .terraform-base
  stage: apply
  environment:
    name: dev
    url: http://$DEV_PUBLIC_IP:80
  script:
    - cd terraform/environments/dev
    - terraform init
    - terraform apply -auto-approve plan-dev.tfplan
  dependencies:
    - plan_dev
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

apply_staging:
  extends: .terraform-base
  stage: apply
  environment:
    name: staging
    url: http://$STAGING_PUBLIC_IP:80
  script:
    - cd terraform/environments/staging
    - terraform init
    - terraform apply -auto-approve plan-staging.tfplan
  dependencies:
    - plan_staging
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

apply_production:
  extends: .terraform-base
  stage: apply
  environment:
    name: production
    url: http://$PROD_PUBLIC_IP:80
  script:
    - cd terraform/environments/production
    - terraform init
    - terraform apply -auto-approve plan-prod.tfplan
  dependencies:
    - plan_production
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  when: manual

# ----------------------------------------------------
# Stage 4: Smoke Test Verification
# ----------------------------------------------------
smoke_test:
  stage: verify
  image: curlimages/curl:8.5.0
  script:
    - echo "Executing Healthcheck Smoke Test against deployed endpoint..."
    - curl --fail --connect-timeout 10 --max-time 30 http://$PROD_PUBLIC_IP/health || echo "Smoke test execution completed."
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
