# ==============================================================================
# GitLab CI/CD Pipeline Automation: Pull-Based GitOps & Image Tagging
# Path: .gitlab-ci.yml
# ==============================================================================

stages:
  - validate
  - plan
  - deploy

variables:
  DOCKER_DRIVER: overlay2

# ------------------------------------------------------------------------------
# Stage 1: Validate Infrastructure, Kubernetes Manifests & Security Scanning
# ------------------------------------------------------------------------------
validate_iac:
  stage: validate
  image:
    name: ghcr.io/opentofu/opentofu:1.6.2
    entrypoint: [""]
  script:
    - tofu fmt -check -recursive terraform/
    - cd terraform/environments/production
    - tofu init -backend=false
    - tofu validate

validate_k8s_manifests:
  stage: validate
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - kubectl kustomize k8s/base > /dev/null
    - kubectl kustomize k8s/components/strict-network > /dev/null
    - kubectl kustomize k8s/components/kyverno-policies > /dev/null
    - kubectl kustomize k8s/overlays/production > /dev/null
    - kubectl kustomize k8s/overlays/staging > /dev/null
    - echo "Kubernetes base manifests, security components, and production/staging overlays validation successful."

secret_scan:
  stage: validate
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --config=.gitleaks.toml --verbose --redact
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

validate_ansible:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install ansible
    - ansible-playbook --syntax-check ansible/site.yml || true

security_scan_iac:
  stage: validate
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - echo "Scanning Kubernetes manifests and OpenTofu IaC for misconfigurations..."
    - trivy config --severity HIGH,CRITICAL k8s/
    - trivy config --severity HIGH,CRITICAL terraform/
  allow_failure: true

# ------------------------------------------------------------------------------
# Stage 2: OpenTofu Plan (Dry Run)
# ------------------------------------------------------------------------------
plan_infrastructure:
  stage: plan
  image:
    name: ghcr.io/opentofu/opentofu:1.6.2
    entrypoint: [""]
  script:
    - cd terraform/environments/production
    - tofu init
    - tofu plan
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

# ------------------------------------------------------------------------------
# Stage 3: GitOps Deployment (Update Kustomize Image Tag in Git)
# ------------------------------------------------------------------------------
deploy_tag_update:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache git bash sed
  script:
    - |
      if [ -n "$TRIGGERED_APP_NAME" ] && [ -n "$TRIGGERED_IMAGE_TAG" ]; then
        echo "Updating image tag for $TRIGGERED_APP_NAME to $TRIGGERED_IMAGE_TAG in Git..."
        sed -i "/name: registry.gitlab.com\/manveersyan-group\/${TRIGGERED_APP_NAME}$/{n;s/newTag:.*/newTag: ${TRIGGERED_IMAGE_TAG}/;}" k8s/overlays/production/kustomization.yaml
        git config user.name "GitLab CI Bot"
        git config user.email "ci-bot@manveersyan.com"
        git add k8s/overlays/production/kustomization.yaml
        if ! git diff --staged --quiet; then
          git commit -m "chore(gitops): update image tag for ${TRIGGERED_APP_NAME} to ${TRIGGERED_IMAGE_TAG} [skip ci]"
          git push "https://oauth2:${GITLAB_ACCESS_TOKEN:-$CI_JOB_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git" HEAD:$CI_COMMIT_REF_NAME
        else
          echo "No image tag changes to commit."
        fi
      else
        echo "No image tag update requested. Pull-based GitOps operator (Flux v2) handles reconciliation."
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
