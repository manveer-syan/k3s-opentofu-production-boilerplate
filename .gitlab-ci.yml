# ==============================================================================
# Central Platform Infrastructure CI/CD Pipeline
# Group: manveersyan-group
# Repository: ate (Infrastructure Orchestration)
# ==============================================================================

stages:
  - lint_and_validate
  - terraform_plan
  - terraform_apply
  - deploy_group_apps

variables:
  AWS_DEFAULT_REGION: "us-east-1"
  TF_ROOT: "terraform"

# ----------------------------------------------------
# Stage 1: Validate Terraform & Ansible Syntax
# ----------------------------------------------------
validate_infrastructure:
  stage: lint_and_validate
  image: hashicorp/terraform:latest
  script:
    - cd $TF_ROOT
    - terraform init -backend=false
    - terraform validate

# ----------------------------------------------------
# Stage 2: Terraform Plan Output
# ----------------------------------------------------
plan_infrastructure:
  stage: terraform_plan
  image: hashicorp/terraform:latest
  script:
    - cd $TF_ROOT
    - terraform init -backend=false
    - terraform plan -out=tfplan
  artifacts:
    paths:
      - terraform/tfplan
    expire_in: 1 day
  only:
    - dev
    - main

# ----------------------------------------------------
# Stage 3: Apply Infrastructure Provisioning
# ----------------------------------------------------
apply_infrastructure:
  stage: terraform_apply
  image: hashicorp/terraform:latest
  script:
    - cd $TF_ROOT
    - echo "Applying Infrastructure Provisioning for manveersyan-group..."
    # Uncomment when AWS_ACCESS_KEY_ID & AWS_SECRET_ACCESS_KEY configured in GitLab CI/CD Variables:
    # - terraform init
    # - terraform apply -auto-approve
  only:
    - dev
    - main
  when: manual

# ----------------------------------------------------
# Stage 4: Wire Group Microservices Pipeline Trigger
# ----------------------------------------------------
deploy_manveersyan_apps:
  stage: deploy_group_apps
  script:
    - echo "Wiring group microservices (web-frontend, api-gateway, auth-service)..."
    - echo "Deployment trigger sent to manveersyan-group apps."
  only:
    - dev
    - main
