# ==============================================================================
# GitLab CI/CD Pipeline Automation: Infrastructure & Deployment (ATE)
# Path: .gitlab-ci.yml
# ==============================================================================

stages:
  - validate
  - plan
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  EC2_HOST: "34.198.184.122"

# ------------------------------------------------------------------------------
# Stage 1: Validate Infrastructure & Kubernetes Manifests
# ------------------------------------------------------------------------------
validate_iac:
  stage: validate
  image:
    name: ghcr.io/opentofu/opentofu:1.6.2
    entrypoint: [""]
  script:
    - cd terraform/environments/production
    - tofu init -backend=false
    - tofu validate

validate_k8s_manifests:
  stage: validate
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - kubectl kustomize k8s/overlays/production > /dev/null
    - echo "Kubernetes manifests validation successful."

validate_ansible:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install ansible
    - ansible-playbook --syntax-check ansible/site.yml || true

security_scan_iac:
  stage: validate
  image:
    name: aquasec/trivy:latest
    entrypoint: [""]
  script:
    - echo "Scanning Kubernetes manifests and OpenTofu IaC for misconfigurations..."
    - trivy config k8s/
    - trivy config terraform/
  allow_failure: true

# ------------------------------------------------------------------------------
# Stage 2: OpenTofu Plan (Dry Run)
# ------------------------------------------------------------------------------
plan_infrastructure:
  stage: plan
  image:
    name: ghcr.io/opentofu/opentofu:1.6.2
    entrypoint: [""]
  script:
    - cd terraform/environments/production
    - tofu init
    - tofu plan
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

# ------------------------------------------------------------------------------
# Stage 3: Automated Kubernetes Rollout to K3s Cluster
# ------------------------------------------------------------------------------
deploy_to_k3s:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash sed
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      KEY_CONTENT="$SSH_PRIVATE_KEY"
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        KEY_CONTENT="$(cat "$SSH_PRIVATE_KEY")"
      fi
      
      if echo "$KEY_CONTENT" | base64 -d 2>/dev/null | grep -q "PRIVATE KEY"; then
        echo "$KEY_CONTENT" | base64 -d > ~/.ssh/id_ed25519
      elif echo "$KEY_CONTENT" | grep -q "PRIVATE KEY"; then
        printf "%s\n" "$KEY_CONTENT" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/id_ed25519
      else
        echo "$KEY_CONTENT" | base64 -d > ~/.ssh/id_ed25519 2>/dev/null || printf "%s\n" "$KEY_CONTENT" > ~/.ssh/id_ed25519
      fi
    - chmod 600 ~/.ssh/id_ed25519
    - echo "SSH Key Header check:" && head -n 1 ~/.ssh/id_ed25519
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_ed25519
  script:
    - echo "Deploying updated manifests to production K3s cluster..."
    - |
      if [ -n "$TRIGGERED_APP_NAME" ] && [ -n "$TRIGGERED_IMAGE_TAG" ]; then
        echo "Updating image tag for $TRIGGERED_APP_NAME to $TRIGGERED_IMAGE_TAG..."
        sed -i "/name: registry.gitlab.com\/manveersyan-group\/${TRIGGERED_APP_NAME}$/{n;s/newTag:.*/newTag: ${TRIGGERED_IMAGE_TAG}/;}" k8s/overlays/production/kustomization.yaml
      elif [ -n "$CI_COMMIT_SHORT_SHA" ]; then
        echo "Updating image tags to commit SHA: $CI_COMMIT_SHORT_SHA..."
        sed -i "s/newTag: latest/newTag: ${CI_COMMIT_SHORT_SHA}/g" k8s/overlays/production/kustomization.yaml
      fi
    - ssh -o StrictHostKeyChecking=no ubuntu@$EC2_HOST "mkdir -p /opt/apps/projectATE/ate"
    - scp -o StrictHostKeyChecking=no -r k8s ubuntu@$EC2_HOST:/opt/apps/projectATE/ate/
    - ssh -o StrictHostKeyChecking=no ubuntu@$EC2_HOST "kubectl apply -k /opt/apps/projectATE/ate/k8s/overlays/production && kubectl rollout restart deployment -n manveersyan-group"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
