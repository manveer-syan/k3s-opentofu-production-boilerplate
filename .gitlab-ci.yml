# ==============================================================================
# GitLab CI/CD Pipeline Automation: Infrastructure & Deployment (ATE)
# Path: .gitlab-ci.yml
# ==============================================================================

stages:
  - validate
  - plan
  - deploy

variables:
  DOCKER_DRIVER: overlay2
  EC2_HOST: "34.198.184.122"

# ------------------------------------------------------------------------------
# Stage 1: Validate Infrastructure & Kubernetes Manifests
# ------------------------------------------------------------------------------
validate_iac:
  stage: validate
  image:
    name: ghcr.io/opentofu/opentofu:1.6.2
    entrypoint: [""]
  script:
    - cd terraform/environments/production
    - tofu init -backend=false
    - tofu validate

validate_k8s_manifests:
  stage: validate
  image:
    name: bitnami/kubectl:latest
    entrypoint: [""]
  script:
    - kubectl kustomize k8s/overlays/production > /dev/null
    - echo "Kubernetes manifests validation successful."

validate_ansible:
  stage: validate
  image: python:3.11-slim
  script:
    - pip install ansible
    - ansible-playbook --syntax-check ansible/site.yml || true

# ------------------------------------------------------------------------------
# Stage 2: OpenTofu Plan (Dry Run)
# ------------------------------------------------------------------------------
plan_infrastructure:
  stage: plan
  image:
    name: ghcr.io/opentofu/opentofu:1.6.2
    entrypoint: [""]
  script:
    - cd terraform/environments/production
    - tofu init
    - tofu plan
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"

# ------------------------------------------------------------------------------
# Stage 3: Automated Kubernetes Rollout to K3s Cluster
# ------------------------------------------------------------------------------
deploy_to_k3s:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client bash
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" ~/.ssh/id_ed25519
      elif echo "$SSH_PRIVATE_KEY" | base64 -d 2>/dev/null | grep -q "PRIVATE KEY"; then
        echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
      else
        printf "%s\n" "$SSH_PRIVATE_KEY" | sed 's/\\n/\n/g' | tr -d '\r' > ~/.ssh/id_ed25519
      fi
    - chmod 600 ~/.ssh/id_ed25519
    - eval $(ssh-agent -s)
    - ssh-add ~/.ssh/id_ed25519
  script:
    - echo "Deploying updated manifests to production K3s cluster..."
    - ssh -o StrictHostKeyChecking=no ubuntu@$EC2_HOST "cd /opt/apps/projectATE/ate && kubectl apply -k k8s/overlays/production && kubectl rollout restart deployment -n manveersyan-group"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "dev"
