# ==============================================================================
# Production Docker Compose Application Orchestration
# Path: docker-compose/docker-compose.yml
# ==============================================================================

version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: app-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-appdb}
      POSTGRES_USER: ${DATABASE_USER:-produser}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-devpassword123}
    expose:
      - "5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-produser} -d ${DATABASE_NAME:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Local Email Testing Inbox (Mailpit)
  mailpit:
    image: axllent/mailpit:latest
    container_name: app-mailpit
    restart: always
    expose:
      - "1025"
      - "8025"
    ports:
      - "8025:8025"
    networks:
      - app-network

  # Nginx Reverse Proxy Service
  nginx:
    image: nginx:1.25-alpine
    container_name: app-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      web-frontend:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "-O", "-", "http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Web Frontend Microservice (FATE)
  web-frontend:
    build:
      context: ../../fate
      dockerfile: Dockerfile
    image: ${REGISTRY_URL}/web-frontend:latest
    container_name: app-web-frontend
    restart: always
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - API_GATEWAY_URL=${API_GATEWAY_URL:-http://api-gateway:8080}
      - AUTH_SERVICE_URL=${AUTH_SERVICE_URL:-http://auth-service:5000}
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose -O - http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # API Gateway Microservice (GATE)
  api-gateway:
    build:
      context: ../../gate
      dockerfile: Dockerfile
    image: ${REGISTRY_URL}/api-gateway:latest
    container_name: app-api-gateway
    restart: always
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - PORT=8080
      - DATABASE_URL=postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose -O - http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Auth Service Microservice (STATE)
  auth-service:
    build:
      context: ../../state
      dockerfile: Dockerfile
    image: ${REGISTRY_URL}/auth-service:latest
    container_name: app-auth-service
    restart: always
    expose:
      - "5000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - PORT=5000
      - DATABASE_URL=postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - SMTP_HOST=${SMTP_HOST:-mailpit}
      - SMTP_PORT=${SMTP_PORT:-1025}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@manveersyan.com}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose -O - http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Notification Service Microservice (DATE)
  notification-service:
    build:
      context: ../../date
      dockerfile: Dockerfile
    image: ${REGISTRY_URL}/notification-service:latest
    container_name: app-notification-service
    restart: always
    expose:
      - "7000"
    env_file:
      - .env
    environment:
      - APP_ENV=production
      - PORT=7000
      - DATABASE_URL=postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}?sslmode=disable
      - WORKER_COUNT=${WORKER_COUNT:-5}
      - QUEUE_SIZE=${QUEUE_SIZE:-100}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose -O - http://localhost:7000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

networks:
  app-network:
    driver: bridge
