# ==============================================================================
# Production Nginx Reverse Proxy Configuration
# Path: docker-compose/nginx/nginx.conf
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression Setup
    gzip on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Upstream Microservice Cluster Targets
    upstream web_frontend_upstream {
        server web-frontend:3000;
        keepalive 32;
    }

    upstream api_gateway_upstream {
        server api-gateway:8080;
        keepalive 32;
    }

    upstream auth_service_upstream {
        server auth-service:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name localhost;

        # Buffer Settings & Timeouts
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffer_size 4k;
        proxy_buffers 4 32k;
        proxy_busy_buffers_size 64k;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Healthcheck Endpoint
        location /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        # Web Frontend Routing
        location / {
            proxy_pass http://web_frontend_upstream;
        }

        # API Gateway Routing (stripping /api prefix)
        location /api/ {
            rewrite ^/api/(.*)$ /$1 break;
            proxy_pass http://api_gateway_upstream;
        }

        # Auth Service Routing (stripping /auth prefix)
        location /auth/ {
            rewrite ^/auth/(.*)$ /$1 break;
            proxy_pass http://auth_service_upstream;
        }

        # SSL Configuration Template (Uncomment for HTTPS with Certbot Let's Encrypt)
        # listen 443 ssl http2;
        # ssl_certificate /etc/letsencrypt/live/app.manveersyan.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/app.manveersyan.com/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        # ssl_ciphers HIGH:!aNULL:!MD5;
    }
}
