# ==============================================================================
# Prometheus & Grafana Observability Compose Stack
# Path: docker-compose/docker-compose.monitoring.yml
# ==============================================================================

version: '3.8'

services:
  prometheus:
    image: victoriametrics/victoria-metrics:latest
    container_name: monitoring-victoria-metrics
    restart: always
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - victoria-metrics-data:/victoria-metrics-data
    command:
      - '-promscrape.config=/etc/prometheus/prometheus.yml'
      - '-storageDataPath=/victoria-metrics-data'
      - '-retentionPeriod=15d'
      - '-httpListenAddr=:9090'
    expose:
      - "9090"
      - "8428"
    networks:
      - app-network

  grafana:
    image: grafana/grafana:10.2.0
    container_name: monitoring-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-AdminGrafanaSecure123!}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - app-network

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: monitoring-node-exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    expose:
      - "9100"
    networks:
      - app-network

volumes:
  victoria-metrics-data:
  grafana-data:
