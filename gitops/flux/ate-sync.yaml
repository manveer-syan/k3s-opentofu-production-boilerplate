# ==============================================================================
# Flux v2 GitOps Reconciliation & Native In-Memory SOPS Decryption
# Path: gitops/flux/ate-sync.yaml
# ==============================================================================

apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: ate-repo
  namespace: flux-system
spec:
  interval: 1m
  url: https://gitlab.com/manveersyan-group/ate.git
  ref:
    branch: dev
  # If the repository is private, create a secret with a GitLab Deploy Token:
  # secretRef:
  #   name: gitlab-repo-token
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ate-production
  namespace: flux-system
spec:
  targetNamespace: manveersyan-group
  interval: 1m
  path: ./k8s/overlays/production
  prune: true
  sourceRef:
    kind: GitRepository
    name: ate-repo
  decryption:
    provider: sops
    secretRef:
      name: sops-age
