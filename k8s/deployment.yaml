apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-operations-deployment
  namespace: default
  labels:
    app: ate-operations
    tier: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: ate-operations
  template:
    metadata:
      labels:
        app: ate-operations
    spec:
      containers:
        - name: ate-go-app
          image: ate-operations-go:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
