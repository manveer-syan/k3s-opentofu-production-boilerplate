apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ate-operations-ingress
  namespace: default
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ate-operations-service
                port:
                  number: 8080
