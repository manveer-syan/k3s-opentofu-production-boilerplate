apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: manveersyan-group
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: registry.gitlab.com/manveersyan-group/auth-service:latest
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service-svc
  namespace: manveersyan-group
spec:
  ports:
    - port: 5000
      targetPort: 5000
  selector:
    app: auth-service
