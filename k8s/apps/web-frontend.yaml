apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: manveersyan-group
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
    spec:
      containers:
        - name: web-frontend
          image: registry.gitlab.com/manveersyan-group/web-frontend:latest
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: web-frontend-svc
  namespace: manveersyan-group
spec:
  ports:
    - port: 3000
      targetPort: 3000
  selector:
    app: web-frontend
