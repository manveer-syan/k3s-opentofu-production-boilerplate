# ==============================================================================
# Kubernetes Secret Template: Database & Application Credentials
# Path: k8s/base/secret.example.yaml
#
# IMPORTANT:
# 1. DO NOT commit actual secrets or production credentials to Git!
# 2. For local testing, copy this file to 'secret.yaml' (ignored by .gitignore).
# 3. In production, this Secret ('db-credentials-secret') is injected dynamically
#    via GitLab CI/CD Masked & Protected Variables during deployment or via ESO.
# ==============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: db-credentials-secret
  namespace: manveersyan-group
type: Opaque
stringData:
  DATABASE_USER: "CHANGE_ME_DATABASE_USER"
  DATABASE_PASSWORD: "CHANGE_ME_DATABASE_PASSWORD"
  DATABASE_URL: "postgres://CHANGE_ME_DATABASE_USER:CHANGE_ME_DATABASE_PASSWORD@CHANGE_ME_DATABASE_HOST:5432/CHANGE_ME_DATABASE_NAME?sslmode=require"
  JWT_SECRET: "CHANGE_ME_JWT_SECRET_AT_LEAST_32_BYTES_LONG"
