apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials-external-secret
  namespace: manveersyan-group
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: db-credentials-secret
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_USER
      remoteRef:
        key: manveersyan/prod/db-credentials
        property: username
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: manveersyan/prod/db-credentials
        property: password
    - secretKey: DATABASE_URL
      remoteRef:
        key: manveersyan/prod/db-credentials
        property: database_url
    - secretKey: JWT_SECRET
      remoteRef:
        key: manveersyan/prod/db-credentials
        property: jwt_secret
