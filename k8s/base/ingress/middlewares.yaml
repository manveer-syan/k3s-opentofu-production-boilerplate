# ==============================================================================
# Traefik Security & Routing Middlewares
# Path: k8s/base/ingress/middlewares.yaml
# ==============================================================================

apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: manveersyan-group
  labels:
    app.kubernetes.io/name: ingress-security
    app.kubernetes.io/part-of: manveersyan-platform
spec:
  headers:
    sslRedirect: true
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    stsPreload: true
    contentTypeNosniff: true
    browserXssFilter: true
    frameDeny: true
    referrerPolicy: "strict-origin-when-cross-origin"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rate-limit
  namespace: manveersyan-group
  labels:
    app.kubernetes.io/name: ingress-security
    app.kubernetes.io/part-of: manveersyan-platform
spec:
  rateLimit:
    average: 100
    burst: 150
    period: 1s
