# ==============================================================================
# Platform Ingress Specification (Traefik Ingress Controller)
# Path: k8s/base/ingress/ingress.yaml
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: platform-ingress
  namespace: manveersyan-group
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: manveersyan-group-security-headers@kubernetescrd,manveersyan-group-rate-limit@kubernetescrd
  labels:
    app.kubernetes.io/name: platform-ingress
    app.kubernetes.io/part-of: manveersyan-platform
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ate.manveersyan.com
      secretName: ate-tls-cert
  rules:
    - host: ate.manveersyan.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway-svc
                port:
                  number: 80
          - path: /notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service-svc
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-frontend-svc
                port:
                  number: 80
    # Fallback rule for IP-based access or default host
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api-gateway-svc
                port:
                  number: 80
          - path: /notifications
            pathType: Prefix
            backend:
              service:
                name: notification-service-svc
                port:
                  number: 80
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service-svc
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-frontend-svc
                port:
                  number: 80
