# ==============================================================================
# Kyverno Policy: Disallow Privileged Containers & Privilege Escalation
# Path: k8s/components/kyverno-policies/disallow-privileged.yaml
# ==============================================================================

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-privileged-containers
  annotations:
    policies.kyverno.io/title: Disallow Privileged Containers
    policies.kyverno.io/category: Pod Security Standards (Restricted)
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Privileged containers can easily bypass runtime isolation and compromise the host node.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: validate-privileged
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - manveersyan-group
                - staging-manveersyan-group
      validate:
        message: "Privileged containers and privilege escalation are strictly prohibited."
        pattern:
          spec:
            containers:
              - securityContext:
                  allowPrivilegeEscalation: false
                  privileged: "!true"
