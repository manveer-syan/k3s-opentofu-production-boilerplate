---
# ==============================================================================
# Playbook: Application Updates & Deployment
# Path: ansible/playbooks/update-apps.yml
# ==============================================================================

- name: Deploy & Update Application Containers
  hosts: webservers
  become: true

  tasks:
    - name: Ensure target deployment directory exists
      file:
        path: "{{ app_dir }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy docker-compose configuration files
      copy:
        src: "../../docker-compose/{{ item }}"
        dest: "{{ app_dir }}/{{ item }}"
        owner: ubuntu
        group: ubuntu
        mode: '0644'
      loop:
        - docker-compose.yml
        - .env

    - name: Copy Nginx proxy configuration
      copy:
        src: "../../docker-compose/nginx/nginx.conf"
        dest: "{{ app_dir }}/nginx/nginx.conf"
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Execute deployment script
      command: bash {{ app_dir }}/deploy.sh
      args:
        chdir: "{{ app_dir }}"
      register: deploy_output

    - name: Display deployment execution result
      debug:
        var: deploy_output.stdout_lines

    - name: Verify application endpoint health via URI check
      uri:
        url: "http://localhost/health"
        method: GET
        status_code: 200
      register: health_check
      until: health_check.status == 200
      retries: 5
      delay: 5
