---
- name: Deploy ATE Go Operations Suite via Ansible IaC
  hosts: webservers
  become: false

  tasks:
    - name: Verify Docker service availability
      command: docker info
      register: docker_check
      changed_when: false

    - name: Build Go application container image
      command: docker build -t {{ app_image }} .
      args:
        chdir: "{{ playbook_dir }}/.."

    - name: Stop existing container if running
      command: docker stop {{ container_name }}
      ignore_errors: yes
      changed_when: false

    - name: Remove old container instance
      command: docker rm {{ container_name }}
      ignore_errors: yes
      changed_when: false

    - name: Run new Go container instance
      command: >
        docker run -d
        --name {{ container_name }}
        -p {{ app_port }}:8080
        --restart unless-stopped
        {{ app_image }}

    - name: Wait for application healthcheck
      uri:
        url: "http://localhost:{{ app_port }}/health"
        method: GET
        status_code: 200
      register: health_result
      until: health_result.status == 200
      retries: 5
      delay: 2

    - name: Display deployment status
      debug:
        msg: "Application successfully deployed and healthy on http://localhost:{{ app_port }}"
