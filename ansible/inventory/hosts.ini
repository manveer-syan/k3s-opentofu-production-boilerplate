# ==============================================================================
# Ansible Dynamic Host Inventory Template
# Path: ansible/inventory/hosts.ini
# ==============================================================================

[webservers]
# Replace with EC2 public IP from Terraform output: terraform output ec2_public_ip
ec2-host ansible_host=54.210.100.50 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[all:vars]
ansible_python_interpreter=/usr/bin/python3
app_dir=/opt/apps
