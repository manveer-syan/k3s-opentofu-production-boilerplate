<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATE Operations | Minimal Platform</title>
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <header>
    <div>
      <h1>ATE Operations</h1>
      <div class="subtitle">Go Backend • Monochrome IaC Platform</div>
    </div>
    <div>
      <button id="btn-theme-toggle" class="btn-secondary">Theme</button>
      <button id="btn-new-op">+ New Task</button>
    </div>
  </header>

  <div class="stats-grid" id="stats-row"></div>

  <div class="controls">
    <input type="text" id="search-input" placeholder="Search..." />
    <select id="filter-category">
      <option value="All">All Categories</option>
      <option value="Development">Development</option>
      <option value="Operations">Operations</option>
      <option value="Finance">Finance</option>
    </select>
    <select id="filter-priority">
      <option value="All">All Priorities</option>
      <option value="Low">Low</option>
      <option value="Medium">Medium</option>
      <option value="High">High</option>
      <option value="Urgent">Urgent</option>
    </select>
  </div>

  <div id="view-container"></div>

  <!-- Minimal Modal -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <h3 id="modal-title" style="margin-bottom: 12px;">New Operation</h3>
      <form id="op-form">
        <div class="form-group">
          <label style="font-size: 0.75rem; text-transform: uppercase;">Title</label>
          <input type="text" id="op-title" required />
        </div>
        <div class="form-group">
          <label style="font-size: 0.75rem; text-transform: uppercase;">Description</label>
          <textarea id="op-desc" rows="2"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label style="font-size: 0.75rem; text-transform: uppercase;">Category</label>
            <select id="op-category">
              <option value="Development">Development</option>
              <option value="Operations">Operations</option>
              <option value="Finance">Finance</option>
            </select>
          </div>
          <div class="form-group">
            <label style="font-size: 0.75rem; text-transform: uppercase;">Priority</label>
            <select id="op-priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
              <option value="Urgent">Urgent</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label style="font-size: 0.75rem; text-transform: uppercase;">Status</label>
            <select id="op-status">
              <option value="To Do">To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
          </div>
          <div class="form-group">
            <label style="font-size: 0.75rem; text-transform: uppercase;">Lead</label>
            <input type="text" id="op-lead" />
          </div>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:12px;">
          <button type="button" id="btn-cancel" class="btn-secondary">Cancel</button>
          <button type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="./js/app.js"></script>
</body>
</html>
